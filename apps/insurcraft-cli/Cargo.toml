[package]
name = "insurcraft-cli"
description = "InsurCraft command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "insurcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
insurcraft-render = { workspace = true }
serde_json = { workspace = true }
insurcraft-engine = { workspace = true }
insurcraft-cos = { workspace = true }
insurcraft-automation = { workspace = true }
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for insurcraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`insurcraft-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["insurcraft-automation/mcp"]
