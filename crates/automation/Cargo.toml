[package]
name = "insurcraft-automation"
description = "Agent control for InsurCraft: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
insurcraft-engine = { workspace = true }
insurcraft-render = { workspace = true }
insurcraft-organize = { workspace = true }
insurcraft-platform = { workspace = true }
serde_json = { workspace = true }
png = "0.18"
base64 = { version = "0.23", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
insurcraft-cos = { workspace = true }
insurcraft-model = { workspace = true }
insurcraft-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
