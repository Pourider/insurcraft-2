[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/insurcraft", "apps/insurcraft-cli", "xtask"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Pourider/insurcraft"

[workspace.dependencies]
# internal
insurcraft-geom = { path = "crates/geom", version = "2.0.0" }
insurcraft-filters = { path = "crates/filters", version = "2.0.0" }
insurcraft-cos = { path = "crates/cos", version = "2.0.0" }
insurcraft-crypt = { path = "crates/crypt", version = "2.0.0" }
insurcraft-organize = { path = "crates/organize", version = "2.0.0" }
insurcraft-measure = { path = "crates/measure", version = "2.0.0" }
insurcraft-annot = { path = "crates/annot", version = "2.0.0" }
insurcraft-fonts = { path = "crates/fonts", version = "2.0.0" }
insurcraft-model = { path = "crates/model", version = "2.0.0" }
insurcraft-content = { path = "crates/content", version = "2.0.0" }
insurcraft-redact = { path = "crates/redact", version = "2.0.0" }
insurcraft-print = { path = "crates/print", version = "2.0.0" }
insurcraft-xfdf = { path = "crates/xfdf", version = "2.0.0" }
insurcraft-sign = { path = "crates/sign", version = "2.0.0" }
insurcraft-optimize = { path = "crates/optimize", version = "2.0.0" }
insurcraft-a11y = { path = "crates/a11y", version = "2.0.0" }
insurcraft-ocr = { path = "crates/ocr", version = "2.0.0" }
insurcraft-js = { path = "crates/js", version = "2.0.0" }
insurcraft-compare = { path = "crates/compare", version = "2.0.0" }
insurcraft-preflight = { path = "crates/preflight", version = "2.0.0" }
insurcraft-export = { path = "crates/export", version = "2.0.0" }
insurcraft-edit = { path = "crates/edit", version = "2.0.0" }
insurcraft-create = { path = "crates/create", version = "2.0.0" }
insurcraft-forms = { path = "crates/forms", version = "2.0.0" }
insurcraft-xfa = { path = "crates/xfa", version = "2.0.0" }
insurcraft-render = { path = "crates/render", version = "2.0.0" }
insurcraft-engine = { path = "crates/engine", version = "2.0.0" }
insurcraft-platform = { path = "crates/platform", version = "2.0.0" }
insurcraft-ui-egui = { path = "crates/ui-egui", version = "2.0.0" }
insurcraft-automation = { path = "crates/automation", version = "2.0.0", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
