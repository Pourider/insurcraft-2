# InsurCraft 2.0 static site: InsurCraft Fácil at / and the full WebAssembly app at /completa/.
# Nothing here proxies or stores anything: PDFs are processed in the visitor's browser and never
# reach this server. Runs as an unprivileged user on port 8080; put TLS (and HSTS) on the
# company's reverse proxy or load balancer in front of it.

server_tokens off;

# A browser only ever GETs files from this site. Uploads, forms and large bodies are never
# legitimate here, so the limits are tight.
client_max_body_size 1k;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
send_timeout 30s;

map $request_method $bad_method {
    default 1;
    GET 0;
    HEAD 0;
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    autoindex off;
    disable_symlinks on;

    if ($bad_method) { return 405; }

    # InsurCraft Fácil: plain HTML, ES modules, no inline scripts. The page and pdf.js need nothing
    # outside this origin; blob: is for the result PDFs and pdf.js's worker, data: for thumbnails.
    set $csp_facil "default-src 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    # The full app (built by trunk) boots WebAssembly from a small inline module script, so it
    # needs 'unsafe-inline' and 'wasm-unsafe-eval'; still no network beyond this origin.
    set $csp_completa "default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    # Never serve dotfiles, sources, maps or documentation that may be copied in by mistake.
    location ~ /\. { return 404; }
    location ~* \.(map|md|toml|rs|sh|ps1)$ { return 404; }

    location /completa/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp_completa always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;

        location ~* \.wasm$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Security-Policy $csp_completa always;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            default_type application/wasm;
            try_files $uri =404;
        }
    }

    # ES modules must be served as JavaScript; older nginx mime.types lacks .mjs.
    location ~* \.mjs$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp_facil always;
        add_header Cache-Control "public, max-age=86400" always;
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    location ~* \.(woff2|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp_facil always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy $csp_facil always;
        # HTML, app.js and app.css change with each release: always revalidate.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
